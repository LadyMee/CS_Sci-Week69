<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComSci - Squirrels Go Nuts Logic Challenge (ชิงเวลาโกยรางวัล)</title>
    <!-- เรียกใช้ฟอนต์ Prompt จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, #001529, #003366, #004d99); 
            margin: 0;
            padding-top: 40px;
            color: #ffffff;
            min-height: 100vh;
        }

        .header-container {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 { 
            margin: 0;
            font-size: 48px;
            color: #FFCC00; 
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.6);
            letter-spacing: 2px;
        }

        h2 {
            margin: 5px 0 0 0;
            font-size: 18px;
            font-weight: 400;
            color: #99ccff; 
            letter-spacing: 1px;
        }

        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
        }

        /* ลูกศรชี้ */
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 45px solid #FFCC00; 
            z-index: 10;
            filter: drop-shadow(0px 4px 5px rgba(0,0,0,0.6));
        }

        /* ตัววงล้อ (ปรับองศาตามสัดส่วนเป๊ะๆ 39%, 39%, 10%, 7%, 5%) */
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #FF595E 0deg 140.4deg,        /* 1 นาที (39%) */
                #FFCA3A 140.4deg 280.8deg,    /* 1.30 นาที (39%) */
                #8AC926 280.8deg 316.8deg,    /* 2 นาที (10%) */
                #1982C4 316.8deg 342deg,      /* 2.30 นาที (7%) */
                #6A4C93 342deg 360deg         /* 3 นาที (5%) */
            );
            transition: transform 3.5s cubic-bezier(0.33, 1, 0.68, 1);
            position: relative;
            overflow: hidden;
            border: 8px solid #FFCC00; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            box-sizing: border-box;
        }

        /* ตัวเลขในวงล้อ */
        .label {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 140px;
            height: 30px;
            margin-top: -15px;
            transform-origin: 0 50%;
            font-weight: 700;
            font-size: 20px; /* ปรับเล็กลงนิดนึง เพื่อให้พอดีกับช่อง 5% */
            color: #ffffff;
            text-shadow: 2px 2px 4px #000000, -1px -1px 2px #000000; 
            text-align: right;
            padding-right: 15px;
            box-sizing: border-box;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 40px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            font-family: 'Prompt', sans-serif;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .spin-btn {
            color: #001529;
            background-color: #FFCC00; 
            border: 2px solid #FFCC00;
        }
        .spin-btn:hover { background-color: #ffdb4d; box-shadow: 0 4px 20px rgba(255, 204, 0, 0.5); }
        .spin-btn:active { transform: scale(0.95); }
        .spin-btn:disabled { background-color: #334d66; border-color: #334d66; color: #888; cursor: not-allowed; box-shadow: none; }

        .stop-btn {
            color: #FFCC00;
            background-color: #d90429; 
            border: 2px solid #FFCC00;
        }
        .stop-btn:hover:not(:disabled) { background-color: #004d99; box-shadow: 0 4px 20px rgba(0, 102, 204, 0.5); }
        .stop-btn:active:not(:disabled) { transform: scale(0.95); }
        .stop-btn:disabled { background-color: #1a334d; border-color: #1a334d; color: #555; cursor: not-allowed; box-shadow: none; }
        
        .stop-btn.paused {
            background-color: #FFCC00; 
            color: #003366; 
            border: 2px solid #003366;
        }

        .timer-box {
            margin-top: 30px;
            text-align: center;
            background: rgba(0, 31, 63, 0.5); 
            backdrop-filter: blur(10px);
            padding: 20px 50px;
            border-radius: 20px;
            border: 1px solid rgba(255, 204, 0, 0.3); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }
        
        #timerDisplay {
            font-size: 65px;
            font-weight: 700;
            font-family: monospace;
            color: #FFCC00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
            margin-bottom: 5px;
            transition: color 0.3s;
        }

        #statusText {
            margin: 0;
            font-size: 16px;
            color: #e6f2ff;
        }
    </style>
</head>
<body>

    <audio id="alarmSound" src="alarm.mp3" preload="auto"></audio>

    <div class="header-container">
        <h1>ComSci - Squirrels Go Nuts Logic Challenge</h1>
        <h2>วิทยาการคอมพิวเตอร์ มทร.ตะวันออก บางพระ</h2>
    </div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <div class="wheel" id="wheel">
            <!-- หมุนข้อความให้เข้ากึ่งกลางของแต่ละช่วงองศาใหม่ -->
            <div class="label" style="transform: rotate(-19.8deg);">1 นาที</div>
            <div class="label" style="transform: rotate(120.6deg);">1.30 นาที</div>
            <div class="label" style="transform: rotate(208.8deg);">2 นาที</div>
            <div class="label" style="transform: rotate(239.4deg);">2.30 นาที</div>
            <div class="label" style="transform: rotate(261deg);">3 นาที</div>
        </div>
    </div>

    <div class="button-group">
        <button class="btn spin-btn" id="spinBtn" onclick="spin()">หมุนวงล้อ!</button>
        <button class="btn stop-btn" id="stopBtn" onclick="toggleTimer()" disabled>หยุดเวลา</button>
    </div>

    <div class="timer-box">
        <div id="timerDisplay">00:00</div>
        <p id="statusText">กดปุ่ม "หมุนวงล้อ!" เพื่อเริ่มสุ่มเวลา</p>
    </div>

    <script>
        let currentRotation = 0;
        let timerInterval;
        let timeRemaining = 0;
        let isPaused = false;

        function spin() {
            const spinBtn = document.getElementById('spinBtn');
            const stopBtn = document.getElementById('stopBtn');
            
            spinBtn.disabled = true;
            stopBtn.disabled = true;
            stopBtn.innerText = "หยุดเวลา";
            stopBtn.classList.remove('paused');
            isPaused = false;
            
            clearInterval(timerInterval);
            document.getElementById('timerDisplay').innerText = "00:00";
            document.getElementById('timerDisplay').style.color = "#FFCC00"; 
            document.getElementById('statusText').innerText = "กำลังสุ่ม...";

            const alarm = document.getElementById('alarmSound');
            if(alarm) {
                alarm.pause();
                alarm.currentTime = 0;
            }

            const wheel = document.getElementById('wheel');
            
            const randomDeg = Math.floor(Math.random() * 360) + (360 * 5); 
            currentRotation += randomDeg;
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                const timeLabels = ["1", "1.30", "2", "2.30", "3"]; 
                const timeInSeconds = [60, 90, 120, 150, 180]; 
                
                const actualDeg = currentRotation % 360;
                // คำนวณองศาเมื่อเทียบกับลูกศร (0 องศาคือจุดบนสุด)
                const originalAngleAtTop = (360 - actualDeg) % 360;
                
                let winnerIndex = 0;
                // แบ่งโซนตามสัดส่วน % ที่ตั้งไว้
                if (originalAngleAtTop >= 0 && originalAngleAtTop < 140.4) {
                    winnerIndex = 0; // 1 นาที (39%)
                } else if (originalAngleAtTop >= 140.4 && originalAngleAtTop < 280.8) {
                    winnerIndex = 1; // 1.30 นาที (39%)
                } else if (originalAngleAtTop >= 280.8 && originalAngleAtTop < 316.8) {
                    winnerIndex = 2; // 2 นาที (10%)
                } else if (originalAngleAtTop >= 316.8 && originalAngleAtTop < 342.0) {
                    winnerIndex = 3; // 2.30 นาที (7%)
                } else {
                    winnerIndex = 4; // 3 นาที (5%)
                }
                
                const winnerLabel = timeLabels[winnerIndex];
                const winnerSeconds = timeInSeconds[winnerIndex];

                document.getElementById('statusText').innerText = `คุณได้เวลา ${winnerLabel} นาที! เวลากำลังเดิน...`;
                spinBtn.disabled = false;
                
                startTimer(winnerSeconds);
            }, 3500);
        }

        function startTimer(seconds) {
            timeRemaining = seconds; 
            updateTimerDisplay(timeRemaining);
            
            document.getElementById('stopBtn').disabled = false;
            timerInterval = setInterval(timerTick, 1000);
        }

        function timerTick() {
            timeRemaining--;
            updateTimerDisplay(timeRemaining);

            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                document.getElementById('statusText').innerText = "⏰ หมดเวลา หมดเวลา ไปฝึกมาใหม่นะ";
                document.getElementById('timerDisplay').style.color = "#ff4d4d"; 
                document.getElementById('stopBtn').disabled = true;
                
                const alarm = document.getElementById('alarmSound');
                if(alarm) {
                    alarm.play().catch(e => console.log("เบราว์เซอร์บล็อกการเล่นเสียง หรือหาไฟล์ alarm.mp3 ไม่เจอ"));
                }

                setTimeout(() => {
                    alert("⏰ หมดเวลา หมดเวลา ไปฝึกมาใหม่นะ");
                }, 500);
            }
        }

        function toggleTimer() {
            const stopBtn = document.getElementById('stopBtn');
            
            if (timeRemaining <= 0) return; 

            if (isPaused) {
                isPaused = false;
                stopBtn.innerText = "หยุดเวลา";
                stopBtn.classList.remove('paused');
                document.getElementById('statusText').innerText = "เวลากำลังเดิน...";
                timerInterval = setInterval(timerTick, 1000);
            } else {
                isPaused = true;
                stopBtn.innerText = "เล่นต่อ";
                stopBtn.classList.add('paused');
                document.getElementById('statusText').innerText = "หยุดเวลาชั่วคราว (Pause)";
                clearInterval(timerInterval);
            }
        }

        function updateTimerDisplay(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${m}:${s}`;
        }
    </script>

</body>
</html>
